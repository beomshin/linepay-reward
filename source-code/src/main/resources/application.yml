spring:
  application:
    name: linepay-reward
  datasource:
    # 외부 인프라 없이 실행할 수 있도록 In-memory H2 사용
    url: jdbc:h2:mem:linepay;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    # 엔티티 기반 스키마 생성 후 data.sql(Seed Data) 적재
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

linepay:
  clock:
    # 서비스 기준 시각(KST).
    # 과제 9절 "Seed Data 검증 기준 시각"(2026-09-01T12:00:00+09:00)으로 고정한다.
    # 값을 비우면 시스템 현재 시각(KST)을 사용한다.
    fixed-at: 2026-09-01T12:00:00+09:00
