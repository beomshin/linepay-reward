# =====================================================================
# 공통 설정 (모든 프로파일에 적용)
#  - 프로파일별 설정: application-{local|dev|prod}.yml
#  - 프로파일을 지정하지 않으면 local 로 기동한다.
#  - 로그 출력 방식은 logback-spring.xml 에서 프로파일별로 정의한다.
# =====================================================================
spring:
  application:
    name: linepay-reward
  profiles:
    default: local
  datasource:
    # 외부 인프라 없이 실행할 수 있도록 In-memory H2 사용 (과제 3절 실행 조건)
    url: jdbc:h2:mem:linepay;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    # 엔티티 기반 스키마 생성 후 data.sql(Seed Data) 적재
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: Asia/Seoul
  # 일자별 미션 조회 캐시 (교정 5)
  #  - entryPeriodMissions: 키 = 조회 일자(yyyyMMdd), 값 = 그날 참여 기간에 걸친 미션 목록
  #  - expireAfterWrite=10m: 만료 시간(TTL). 미션 데이터 변경은 최대 10분 뒤 반영된다 (별도 무효화 처리 없음)
  cache:
    type: caffeine
    cache-names: entryPeriodMissions
    caffeine:
      spec: maximumSize=100,expireAfterWrite=10m

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    com.linepay.reward: INFO
